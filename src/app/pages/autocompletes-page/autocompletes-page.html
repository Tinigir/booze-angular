<div class="container mt-4">
  <div class="row">
    <div class="col-md-6">
      <h3>Autocomplete Cocktails</h3>
      <mat-form-field class="w-100">
        <input
          type="text"
          placeholder="Pick one"
          aria-label="Number"
          matInput
          [formControl]="cocktailsSearchControl"
          [matAutocomplete]="cocktailAuto"
        />
        <mat-autocomplete #cocktailAuto="matAutocomplete">
          @for (option of cocktailFilteredOptions(); track option) {
            <mat-option [value]="option">{{ option }}</mat-option>
          }
        </mat-autocomplete>
      </mat-form-field>
    </div>

    <div class="col-md-6">
    <h3>Autocomplete ingredients</h3>
      <mat-form-field class="w-100">
        <input
          type="text"
          placeholder="Pick one"
          aria-label="Number"
          matInput
          [formControl]="ingredientsSearchControl"
          [matAutocomplete]="ingredientAuto"
        />
        <mat-autocomplete #ingredientAuto="matAutocomplete">
          @for (option of ingredientsFilteredOptions(); track option) {
            <mat-option [value]="option">{{ option }}</mat-option>
          }
        </mat-autocomplete>
      </mat-form-field>
    </div>
  </div>
</div>
